name: Reproduce research study
on: workflow_dispatch
jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bank-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: bank-marketing/requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - run: python download_data.py
      - run: python run_experiments.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: bank-marketing/results/
